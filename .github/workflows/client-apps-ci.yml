name: client-apps-ci

on:
  push:
    paths:
      - "client-apps/**"
      - ".github/workflows/client-apps-ci.yml"
  pull_request:
    paths:
      - "client-apps/**"
      - ".github/workflows/client-apps-ci.yml"
  workflow_dispatch:
    inputs:
      publish_driver_app:
        description: "Build a signed release and distribute it to the configured Firebase testers"
        required: true
        default: false
        type: boolean
      build_garage_tv_release:
        description: "Build a signed Android TV APK for manual delivery"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client-apps
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android 36 platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build shared logic and both debug shells
        run: ./gradlew :sharedLogic:build :driverApp:assembleDebug :androidApp:assembleDebug
      - name: Test both Android shells
        run: ./gradlew :driverApp:testDebugUnitTest :androidApp:testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: driver-app-debug
          path: client-apps/driverApp/build/outputs/apk/debug/driverApp-debug.apk
          if-no-files-found: error
          retention-days: 7

  distribute-driver-app:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_driver_app
    needs: verify
    runs-on: ubuntu-latest
    environment: driver-release
    defaults:
      run:
        working-directory: client-apps
    env:
      HERMES_API_BASE_URL: ${{ vars.HERMES_API_BASE_URL }}
      HERMES_DRIVER_RELEASE_STORE_PASSWORD: ${{ secrets.HERMES_DRIVER_RELEASE_STORE_PASSWORD }}
      HERMES_DRIVER_RELEASE_KEY_ALIAS: ${{ secrets.HERMES_DRIVER_RELEASE_KEY_ALIAS }}
      HERMES_DRIVER_RELEASE_KEY_PASSWORD: ${{ secrets.HERMES_DRIVER_RELEASE_KEY_PASSWORD }}
      FIREBASE_APP_ID: ${{ vars.FIREBASE_DRIVER_APP_ID }}
      FIREBASE_TESTER_GROUPS: ${{ vars.FIREBASE_DRIVER_TESTER_GROUPS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android 36 platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate and prepare release credentials
        env:
          KEYSTORE_BASE64: ${{ secrets.HERMES_DRIVER_RELEASE_KEYSTORE_BASE64 }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_DRIVER_SERVICE_ACCOUNT_JSON }}
        run: |
          for name in KEYSTORE_BASE64 HERMES_DRIVER_RELEASE_STORE_PASSWORD HERMES_DRIVER_RELEASE_KEY_ALIAS HERMES_DRIVER_RELEASE_KEY_PASSWORD HERMES_API_BASE_URL FIREBASE_APP_ID FIREBASE_TESTER_GROUPS FIREBASE_SERVICE_ACCOUNT_JSON; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required driver release environment value: $name"
              exit 1
            fi
          done
          case "$HERMES_API_BASE_URL" in
            https://*) ;;
            *) echo "::error::HERMES_API_BASE_URL must use HTTPS"; exit 1 ;;
          esac
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/driver-release.jks"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "HERMES_DRIVER_RELEASE_KEYSTORE=$RUNNER_TEMP/driver-release.jks" >> "$GITHUB_ENV"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"
      - name: Build signed driver release
        run: ./gradlew :driverApp:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: driver-app-release
          path: client-apps/driverApp/build/outputs/apk/release/driverApp-release.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Distribute to Firebase App Distribution
        run: >-
          npx --yes firebase-tools@15.34.0 appdistribution:distribute
          driverApp/build/outputs/apk/release/driverApp-release.apk
          --app "$FIREBASE_APP_ID"
          --groups "$FIREBASE_TESTER_GROUPS"
          --release-notes "Driver app ${GITHUB_REF_NAME} (${GITHUB_SHA})"

  build-garage-tv-release:
    if: github.event_name == 'workflow_dispatch' && inputs.build_garage_tv_release
    needs: verify
    runs-on: ubuntu-latest
    environment: garage-tv-release
    defaults:
      run:
        working-directory: client-apps
    env:
      HERMES_RELEASE_STORE_PASSWORD: ${{ secrets.HERMES_RELEASE_STORE_PASSWORD }}
      HERMES_RELEASE_KEY_ALIAS: ${{ secrets.HERMES_RELEASE_KEY_ALIAS }}
      HERMES_RELEASE_KEY_PASSWORD: ${{ secrets.HERMES_RELEASE_KEY_PASSWORD }}
      HERMES_API_BASE_URL: ${{ vars.HERMES_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android 36 platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate and prepare TV release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.HERMES_RELEASE_KEYSTORE_BASE64 }}
        run: |
          for name in KEYSTORE_BASE64 HERMES_RELEASE_STORE_PASSWORD HERMES_RELEASE_KEY_ALIAS HERMES_RELEASE_KEY_PASSWORD HERMES_API_BASE_URL; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required garage TV release environment value: $name"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/garage-tv-release.jks"
          echo "HERMES_RELEASE_KEYSTORE=$RUNNER_TEMP/garage-tv-release.jks" >> "$GITHUB_ENV"
      - name: Build signed Android TV APK
        run: ./gradlew :androidApp:assembleRelease
      - name: Verify APK signature
        run: >-
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify
          androidApp/build/outputs/apk/release/androidApp-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: garage-tv-release
          path: client-apps/androidApp/build/outputs/apk/release/androidApp-release.apk
          if-no-files-found: error
          retention-days: 30
