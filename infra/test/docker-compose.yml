name: hermes-test

# Local, disposable integration-test stack. These credentials are intentionally
# fixed test values and must never be reused outside this stack.
services:
  mariadb:
    image: mariadb:11.8
    environment:
      MARIADB_ROOT_PASSWORD: local-test-root
      MARIADB_DATABASE: hermes_test
      MARIADB_USER: hermes_test
      MARIADB_PASSWORD: local-test-db
    ports:
      - "127.0.0.1:${TEST_DB_PORT:-3308}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - test-database:/var/lib/mysql

  migrate:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    image: hermes-test-api:local
    command: ["migrate"]
    restart: "no"
    environment:
      DATABASE_URL: mysql://hermes_test:local-test-db@mariadb:3306/hermes_test
      RUST_LOG: info
    depends_on:
      mariadb:
        condition: service_healthy

  tracking-mock:
    image: python:3.12-alpine
    command: ["python3", "/app/tracking_mock.py"]
    volumes:
      - ./tracking_mock.py:/app/tracking_mock.py:ro
    ports:
      - "127.0.0.1:${TEST_TRACKING_MOCK_PORT:-8083}:8080"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    image: hermes-test-api:local
    environment:
      DATABASE_URL: mysql://hermes_test:local-test-db@mariadb:3306/hermes_test
      HOST: 0.0.0.0
      PORT: 8080
      APP_ENV: development
      CORS_ALLOWED_ORIGINS: http://localhost:${TEST_CONSOLE_PORT:-5174}
      BACKOFFICE_BASE_URL: http://localhost:${TEST_CONSOLE_PORT:-5174}
      ACCESS_TOKEN_SECRET: local-test-access-secret-0123456789abcdef0123456789abcdef
      REFRESH_TOKEN_SECRET: local-test-refresh-secret-fedcba9876543210fedcba9876543210
      SYSADMIN_EMAIL: admin@hermes.test
      SYSADMIN_PASSWORD: Local-test-only-Hermes-123!
      GARAGE_ROLLOVER_INTERVAL_SECONDS: ${TEST_GARAGE_ROLLOVER_INTERVAL_SECONDS:-0}
      GARAGE_AUTO_DEPARTURE_INTERVAL_SECONDS: ${TEST_GARAGE_AUTO_DEPARTURE_INTERVAL_SECONDS:-0}
      GARAGE_PRESENCE_POLL_INTERVAL_SECONDS: ${TEST_GARAGE_PRESENCE_POLL_INTERVAL_SECONDS:-0}
      NON_EXECUTION_EVALUATION_INTERVAL_SECONDS: ${TEST_NON_EXECUTION_EVALUATION_INTERVAL_SECONDS:-0}
      TRACKING_API_BASE_URL: http://tracking-mock:8080/api
      TRACKING_API_EMAIL: test
      TRACKING_API_PASSWORD: test
      SMTP_HOST: ""
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      SMTP_FROM: ""
      RUST_LOG: info
    ports:
      - "127.0.0.1:${TEST_API_PORT:-8082}:8080"
    depends_on:
      mariadb:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      tracking-mock:
        condition: service_healthy

  backoffice:
    build:
      context: ../../backoffice
      dockerfile: Dockerfile
    image: hermes-test-backoffice:local
    ports:
      - "127.0.0.1:${TEST_CONSOLE_PORT:-5174}:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  test-database: