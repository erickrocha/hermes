[package]
name = "business"
version = "0.1.0"
edition = "2024"

[dependencies]
entity = { path = "../entity" }

serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
utoipa = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }

argon2 = "0.6.0"
# PD-029: mantido só para verificar hashes legados; nada novo é gravado em bcrypt.
bcrypt = "0.19.3"
log = "0.4.34"
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
base64 = "0.23.1"
lettre = { version = "0.11", default-features = false, features = ["tokio1", "tokio1-native-tls", "smtp-transport", "builder"] }
# EPIC-FT-01: cliente HTTP da fronteira de ingestão de rastreamento (D-15).
# native-tls para não arrastar uma segunda pilha TLS ao lado do lettre.
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
unicode-normalization = "0.1.25"


[dependencies.sea-orm]
version = "2.0.3"
features = ["debug-print", "runtime-tokio-native-tls", "sqlx-mysql"]

[features]
mock = ["sea-orm/mock"]

