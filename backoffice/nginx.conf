# EPIC-XF-10-S01 (HRMS-038). Served by nginx-unprivileged, so :8080 and not :80.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The console is a single-page app with client-side routing: a browser
    # reload on /tenants must serve index.html, not 404. Without this, every
    # deep link breaks the moment a user refreshes the page.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits content-hashed filenames under /assets, so they can be cached
    # indefinitely. index.html must never be cached, or a deploy leaves users
    # on the previous bundle until they hard-refresh.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # The API is same-origin under /api (see Dockerfile). It is routed by
    # Traefik before it reaches this server, so nginx never proxies it.

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
